<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Podplayer</title>
    <script>
      /*
       * GitHub Pages SPA fallback.
       *
       * output: 'export' writes one file per route, so a path with a dynamic
       * segment such as /podcasts/42 has no file of its own and GitHub Pages
       * answers it with this page. The requested path is parked in
       * sessionStorage and the browser is sent to the export's index, where
       * app/page.tsx restores the path and asks the router to render it.
       *
       * WARNING: this file does not survive `next build`. Next writes its own
       * out/404.html from the _not-found route, after copying public/, so the
       * deployed artifact contains Next's application shell instead of this page
       * and the handshake above never runs. Measured in docs/DECISIONS.md entry
       * 18, which also records the one-line deploy change that would make this
       * version win. Kept here because it is that change's other half.
       *
       * "spa-fallback-path" is duplicated in app/page.tsx (SPA_FALLBACK_KEY);
       * change both together.
       *
       * "/" is right because the deploy workflow sets no BASE_PATH. A build with
       * BASE_PATH set would need that prefix here, since files in public/ are
       * copied verbatim and Next does not rewrite them.
       */
      (function () {
        var path =
          window.location.pathname + window.location.search + window.location.hash;
        try {
          window.sessionStorage.setItem("spa-fallback-path", path);
        } catch (error) {
          /* Storage unavailable: the fallback degrades to the index page. */
        }
        window.location.replace("/");
      })();
    </script>
  </head>
  <body>
    <p><a href="/">Podplayer</a></p>
  </body>
</html>
