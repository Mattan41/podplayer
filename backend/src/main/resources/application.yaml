spring:
  application:
    name: backend
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    postgresql:
      transactional-lock: true
  cache:
    type: caffeine
    cache-names: whitelist
    caffeine:
      spec: expireAfterWrite=60s,maximumSize=1000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  # Render controller-raised ResponseStatusException as an RFC 9457 ProblemDetail
  # (title, status, detail, instance; `type` is omitted as the RFC 9457 default)
  # instead of Spring's legacy /error JSON (timestamp, status, error, path). The
  # frontend reads `detail` (frontend/lib/api/podcast.ts messageFrom); docs/api/*.md
  # document it.
  mvc:
    problemdetails:
      enabled: true
server:
  port: 8080
supabase:
  jwks-uri: ${SUPABASE_JWKS_URI}