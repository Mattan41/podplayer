spring:
  application:
    name: backend
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Todo: change to validate and implement flyway migrations when we start augmenting the app (after skeleton deployment is done)
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:

server:
  port: 8080